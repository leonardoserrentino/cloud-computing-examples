apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-deployment
  namespace: user
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ingestion
  template:
    metadata:
      labels:
        app: ingestion
    spec:
      containers:
      - name: ingestion
        image: 03-containerized-microservices-data-ingestion:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
        env:
        # Kubernetes Native Service Discovery using CoreDNS
        - name: ANALYTICS_SERVICE_URL
          value: "http://analytics-service.cloud-innovator.svc.cluster.local:5001/analyze"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: ingestion-service
  namespace: user
spec:
  type: NodePort # Exposes the service to the host machine
  selector:
    app: ingestion
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
      nodePort: 30050
